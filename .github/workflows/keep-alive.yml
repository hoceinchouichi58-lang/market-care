name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (keep-alive)
        run: |
          URL="https://ryghojqcrzokshzxbkhz.supabase.co/rest/v1/sellers?select=id&limit=1"
          KEY="eyJhbGci••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$URL" -H "apikey: $KEY" || echo "000")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Supabase is alive."
              exit 0
            fi
            sleep 20
          done
          echo "Request sent (status not 200) - not failing the job."
          exit 0
